<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restauration</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing:border-box;
            font-family: 'poppins', sans-serif;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height:100vh;
            background-color: #f5ead9;
        }
        .logo-retour span{
            color: #fb911f;
        }
        .contactform{
            background: #fb911f;
            padding: 50px 45px;
            width: 450px;
            max-height: 90vh;
            box-shadow: 5px 15px 50px rgba(0,0,0, 0.5); 
            overflow-y: auto;
            display:flex;
            flex-direction:column;
            display: flex;
            flex-direction: column; 
            gap: 18px;
        }
        .contactform .contactf{
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .contactf label{
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        .contactf input, 
        .message textarea{
            padding: 10px 12px;
            border: 1px solid #d4c9e0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .contactf input:focus,
        .message textarea:focus{
            border-color: #7429ec;
        }
        .message{
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .message label{
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .btn-reservation{
            width: 100%;
            font-size: 1em;
            font-weight: 700;
            text-align: center;
            color: #fff;
            background: #111;
            padding: 12px;
            display: block;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 2px;
            outline: none;
            border: none;
            transition: 0.5s;
        }
        .btn-reservation:hover{
            background: #fff;
            color:#111;
        }
    </style>
</head>
<body>
    <form>
        
        <div class="contactform">
            <div class="contactf">
                <label>Nom :</label>
                <input type="text" placeholder="Jean KOSSI" >
                <br>
            </div>

            <div class="contactf">
                <label>Numéro de téléphone :</label>
                <input type="tel" placeholder="99 999 999" >
                <br>
            </div>

            <div class="contactf">
                <label>Date de reservation :</label>
                <input type="date" placeholder="Date de réservation ">
                <br>
            </div>

            <div class="contactf">
                <label>Heure :</label>
                <input type="time" placeholder="Heure souhaitée">
                <br>
            </div>

            <div class="contactf">
                <label>Nombre de personnes :</label>
                <input type="number" placeholder="Nombre de personnes" >
                <br>
            </div>

        <div class="message">
            <label>Message :</label>
            <textarea placeholder="Entrez votre message" ></textarea>
            <br>

            <button type="submit" class="btn-reservation">Réserver</button>
        </div>
        </div>
    </form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
    const supabase = window.supabase.createClient(
        'https://hmofudgrocrchbjjtcwl.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhtb2Z1ZGdyb2NyY2hiamp0Y3dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2MzIzNjAsImV4cCI6MjA5ODIwODM2MH0.bMZnP5QV6OhcwYoIt4jH8JTiwULTauLXPAUFRCB-5TA'
    );

    document.querySelector('form').addEventListener('submit', async function(e){
        e.preventDefault();
        const { error } = await supabase.from('reservations').insert({
            nom: document.querySelector('[placeholder="Jean KOSSI"]').value,
            telephone: document.querySelector('[placeholder="99 999 999"]').value,
            date: document.querySelector('input[type="date"]').value,
            heure: document.querySelector('input[type="time"]').value,
            nb_personnes: document.querySelector('[placeholder="Nombre de personnes"]').value,
            message: document.querySelector('textarea').value
        });
        if (error) {
            alert("Erreur, réessayez.");
            console.log(error);
        } else {
            alert("Réservation envoyée !");
            document.querySelector('form').reset();
        }
    });
})();
</script>
</body>
</html>
