<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réserver une table – StephFood</title>
  <meta name="description" content="Réservez une table chez StephFood à Lomé. Déjeuner, dîner ou privatisation." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,620;1,9..144,520&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/stephfood.css" />
</head>
<body data-page="reserve" class="is-intro">
  <a class="skip" href="#contenu">Aller au contenu</a>
  <div class="progress" id="progress"></div>
  <div class="loader" id="loader"><div class="loader-mark"><strong class="loader-word"></strong></div></div>
  <header class="site-header scrolled" id="header">
    <a class="logo" href="index.html">Steph<span>Food</span></a>
    <nav class="nav" id="nav">
      <a href="index.html#maison">La maison</a>
      <a href="menu.html">La carte</a>
      <a href="index.html#contact">Contact</a>
      <a href="restauration.html" class="btn btn-ember" aria-current="page">Réserver</a>
    </nav>
    <button class="icon-btn" id="openCart" type="button" aria-label="Ouvrir le panier"><i class="fas fa-bag-shopping"></i><span class="cart-count" data-cart-count>0</span></button>
    <button class="nav-toggle" id="navToggle" type="button" aria-label="Ouvrir le menu"><span></span></button>
  </header>
  <main id="contenu" class="page-hero">
    <div class="container reserve-grid">
      <aside class="panel">
        <h1 style="font-size:clamp(2.8rem,5vw,4.4rem)">La salle vous garde une place.</h1>
        <p class="lede">On confirme par téléphone. Indiquez l'occasion, les allergies, et le plat qui vous a fait venir.</p>
        <div class="hours" id="hoursList"></div>
        <div class="info-list" id="infoList" style="margin-top:22px"></div>
      </aside>
      <form class="panel js-reserve-form" id="reserveForm">
        <h2 class="serif" style="margin-top:0;font-size:2rem">Votre table</h2>
        <div class="form-grid">
          <div class="field"><label for="r-name">Nom complet</label><input id="r-name" name="name" required placeholder="Amina Kossi"></div>
          <div class="field"><label for="r-phone">Téléphone</label><input id="r-phone" name="phone" required placeholder="99 00 00 00"></div>
          <div class="field"><label for="r-email">Email</label><input id="r-email" name="email" type="email" placeholder="optionnel"></div>
          <div class="field"><label for="r-people">Personnes</label><input id="r-people" name="people" type="number" min="1" max="24" value="2" required></div>
          <div class="field"><label for="r-date">Date</label><input id="r-date" name="date" type="date" required></div>
          <div class="field"><label for="r-time">Heure</label><input id="r-time" name="time" type="time" step="900" required></div>
          <div class="field full"><label for="r-occasion">Occasion</label>
            <select id="r-occasion" name="occasion">
              <option>Déjeuner</option>
              <option>Dîner</option>
              <option>Anniversaire</option>
              <option>Privatisation</option>
            </select>
          </div>
          <div class="field full"><label for="r-note">Précisions</label><textarea id="r-note" name="note" rows="4" placeholder="Allergies, chaise bébé, plat en tête..."></textarea></div>
        </div>
        <button class="btn btn-ember" id="reserveBtn" type="submit" style="margin-top:16px">Confirmer la demande</button>
      </form>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-row">
      <a class="logo" href="index.html">Steph<span>Food</span></a>
      <nav><a href="menu.html">Carte</a><a href="admin.html">Espace équipe</a></nav>
    </div>
    <div class="container legal">© <span id="year"></span> StephFood</div>
  </footer>
  <div class="drawer" id="drawer" hidden>
    <div class="backdrop" data-close-cart></div>
    <aside class="drawer-panel" role="dialog" aria-labelledby="cartTitle">
      <div class="dish-top"><h2 id="cartTitle" class="serif" style="margin:0">Votre commande</h2><button class="btn btn-line" type="button" data-close-cart>Fermer</button></div>
      <div class="cart-lines" id="cartLines"></div>
      <form id="checkoutForm">
        <div class="cart-total"><span>Total</span><strong id="cartTotal">0 FCFA</strong></div>
        <div class="field"><label for="o-name">Nom</label><input id="o-name" required></div>
        <div class="field" style="margin-top:8px"><label for="o-phone">Téléphone</label><input id="o-phone" required></div>
        <div class="field" style="margin-top:8px"><label for="o-mode">Mode</label><select id="o-mode"><option>À emporter</option><option>Sur place</option></select></div>
        <div class="field" style="margin-top:8px"><label for="o-note">Note</label><textarea id="o-note" rows="2"></textarea></div>
        <button class="btn btn-ember" style="width:100%;margin-top:12px" type="submit">Envoyer sur WhatsApp</button>
      </form>
    </aside>
  </div>
  <div class="modal" id="dishModal" hidden><div class="backdrop" data-close-modal></div><div class="modal-card" id="dishModalCard"></div></div>
  <div class="confirm" id="confirm" hidden>
    <div class="backdrop" data-close-confirm></div>
    <div class="confirm-card">
      <svg class="check" viewBox="0 0 72 72"><circle cx="36" cy="36" r="26"></circle><path d="M24 37 l8 8 16-18"></path></svg>
      <h3 id="confirmTitle" class="serif"></h3><p id="confirmText" class="lede"></p><strong id="confirmCode"></strong>
      <button class="btn btn-ink" type="button" data-close-confirm>Parfait</button>
    </div>
  </div>
  <div class="toast-wrap" id="toasts"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/core.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
